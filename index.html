<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exciting Racing Car Game</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 text-white font-['Roboto'] flex flex-col items-center min-h-screen p-4">
    <header class="mb-6 text-center">
        <h1 class="text-4xl font-bold mb-2">Exciting Racing Car Game</h1>
        <p class="text-lg">Use arrow keys to move your car. Avoid obstacles and score points!</p>
    </header>

    <div class="relative">
        <canvas id="gameCanvas" width="800" height="600" class="mx-auto block rounded-lg shadow-lg border border-gray-700 bg-gray-900"></canvas>

        <!-- HUD Overlay -->
        <div id="hud" class="absolute top-4 left-4 text-white text-lg font-semibold space-y-1 select-none">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Speed: <span id="speed">0</span> km/h</div>
        </div>

        <!-- Start and Game Over Overlay -->
        <div id="overlay" class="absolute inset-0 bg-black bg-opacity-75 flex flex-col justify-center items-center text-center p-4 rounded-lg hidden">
            <button id="startButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded transition duration-300">
                Start Game
            </button>
            <div id="gameOverMessage" class="mt-6 text-2xl font-bold hidden">Game Over! Your Score: <span id="finalScore">0</span></div>
            <button id="restartButton" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded mt-4 hidden transition duration-300">
                Restart Game
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
